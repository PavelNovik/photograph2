<!doctype html>
<html lang="pl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="description" content="Marcin Nowak Photography — fotografia ślubna, rodzinna, portretowa i krajobrazowa."/>
<meta name="theme-color" content="#151515"/>
<title>Marcin Nowak Photography</title>
<script>
  try {
    var t = localStorage.getItem("mn-theme");
    if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.dataset.theme = t;
    if (localStorage.getItem("mn-lang") === "en") document.documentElement.lang = "en";
  } catch (e) {}
</script>
</head>
<body><div id="root"></div><script type="module" src="/src/main.jsx"></script></body>
</html>
